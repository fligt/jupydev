[project]
name = "jupydev"
version = "0.1.0"
description = "Commandline tthe jupydev cookiecutter"
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "Frank" }
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/fligt/jupydev"
Documentation = "https://fligt.github.io/jupydev"
Repository = "https://github.com/fligt/jupydev"


#[project.scripts]
#fix-uv-jupytext = "fix_uv_jupytext:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.14"]
build-backend = "uv_build"

# these new jupytext settings below should improve 
# the compatibility between vscode (koen) and jupterlab (frank)
# uncommented two lines directly below 
# need to test if this now works  
# toml parsing breaks, so commenting out again
# instead now providing separate folders in ".nbs/" for pairing 

#[tool.jupytext]
#formats = "ipynb,qmd" 

[[tool.jupytext.formats]]
"notebooks/" = "qmd"
"_nbs/_docs/" = "ipynb"

[[tool.jupytext.formats]]
"src/jupydev/" = "py:percent"
"_nbs/_src/" = "ipynb"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab-quarto>=0.3.5",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "pip>=26.3",
]


